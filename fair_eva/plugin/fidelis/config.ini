[Generic]
endpoint = https://zenodo.org/api
api_config = fair-api.yaml

[fidelis]
terms_access_protocols = ['https']
metadata_standard = ['DataCite']

# The Zenodo record DOI identifies both the metadata record and the deposited
# digital object aggregate. Individual files remain reachable through HTTPS.
identifier_term = [['identifier', 'doi'], ['identifier', 'uri']]
identifier_term_data = [['identifier', 'doi']]

terms_quali_generic = [
    ['title', ''],
    ['creator', 'name'],
    ['description', 'abstract'],
    ['publisher', ''],
    ['date', 'issued'],
    ['identifier', 'doi'],
    ['type', 'resourceTypeGeneral'],
    ['rights', 'accessRights'],
    ['rights', 'license'],
    ['subject', 'keyword']]

# Zenodo is multidisciplinary. This list measures fields that add practical
# reuse context without pretending that one domain schema fits every record.
terms_quali_disciplinar = [
    ['description', 'abstract'],
    ['subject', 'keyword'],
    ['version', ''],
    ['relation', 'isDerivedFrom'],
    ['fundingReference', 'awardNumber']]

terms_access = [
    ['rights', 'accessRights'],
    ['rights', 'accessConditions'],
    ['identifier', 'landingPage'],
    ['file', 'downloadUrl']]

terms_cv = [
    ['type', 'resourceTypeGeneral'],
    ['rights', 'accessRights'],
    ['rights', 'license'],
    ['creator', 'orcid'],
    ['subject', 'uri'],
    ['relationType', 'controlled']]

terms_qualified_references = [
    ['creator', 'orcid'],
    ['contributor', 'orcid'],
    ['fundingReference', 'funderIdentifier'],
    ['fundingReference', 'awardUri']]

terms_relations = [
    ['relation', 'isCitedBy'],
    ['relation', 'cites'],
    ['relation', 'isSupplementTo'],
    ['relation', 'isSupplementedBy'],
    ['relation', 'isDescribedBy'],
    ['relation', 'describes'],
    ['relation', 'isNewVersionOf'],
    ['relation', 'isPreviousVersionOf'],
    ['relation', 'isPartOf'],
    ['relation', 'hasPart'],
    ['relation', 'isReferencedBy'],
    ['relation', 'references'],
    ['relation', 'isDerivedFrom'],
    ['relation', 'isSourceOf'],
    ['relation', 'requires'],
    ['relation', 'isRequiredBy']]

terms_relations_only_data = [
    ['relation', 'isSupplementTo'],
    ['relation', 'isSupplementedBy'],
    ['relation', 'isPartOf'],
    ['relation', 'hasPart'],
    ['relation', 'isDerivedFrom'],
    ['relation', 'isSourceOf']]

terms_reusability_richness = [
    ['description', 'abstract'],
    ['subject', 'keyword'],
    ['rights', 'license'],
    ['creator', 'name'],
    ['date', 'issued'],
    ['type', 'resourceTypeGeneral'],
    ['version', ''],
    ['provenance', 'notes'],
    ['format', 'mediaType']]

terms_license = [['rights', 'license'], ['license', ''], ['license', 'uri']]
metadata_schemas = {
    'datacite': 'https://schema.datacite.org/meta/kernel-4.5/',
    'zenodo': 'https://zenodo.org/schemas/records/record-v1.0.0.json'}

supported_data_formats = [
    '.csv', '.tsv', '.json', '.jsonld', '.xml', '.rdf', '.ttl', '.nt',
    '.txt', '.md', '.pdf', '.odt', '.doc', '.docx', '.ods', '.xls', '.xlsx',
    '.nc', '.hdf', '.hdf5', '.tif', '.tiff', '.geotiff', '.geojson', '.gpkg',
    '.shp', '.parquet', '.feather', '.arrow', '.fits', '.npy', '.npz',
    '.jpg', '.jpeg', '.png', '.gif', '.svg', '.wav', '.mp3', '.mp4', '.webm',
    '.zip', '.tar', '.gz', '.tgz', '.bz2', '.xz', '.7z', '.py', '.r', '.ipynb']

