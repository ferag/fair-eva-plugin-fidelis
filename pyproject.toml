[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-eva-plugin-fidelis"
version = "0.1.0"
description = "FIDELIS FAIR EVA 4.0.0 plugin for evaluating Zenodo records"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Fernando Aguilar Gómez" }]
dependencies = [
  "fair_eva @ git+https://github.com/IFCA-Advanced-Computing/FAIR_eva@4.0.0",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/ferag/fair-eva-plugin-fidelis"

[tool.setuptools.packages.find]
where = ["."]
include = ["fair_eva.plugin.fidelis"]
namespaces = true

[tool.setuptools.package-data]
"fair_eva.plugin.fidelis" = ["*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
